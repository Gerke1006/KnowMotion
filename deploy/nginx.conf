# Obtain the certificate with nginx.bootstrap.conf before enabling this file.
server {
    listen 80 default_server;
    server_name knowmotion.gragonapi.com _;
    server_tokens off;
    client_max_body_size 64k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Preserve direct-IP HTTP access while the domain always uses HTTPS.
    location / {
        if ($host = knowmotion.gragonapi.com) {
            return 301 https://knowmotion.gragonapi.com$request_uri;
        }
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name knowmotion.gragonapi.com;
    ssl_certificate /etc/letsencrypt/live/knowmotion.gragonapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knowmotion.gragonapi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KnowMotionTLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Browser requests return promptly; generation runs in the application queue.
    # Disable proxy buffering so shared progress and future event streams stay live.
    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
