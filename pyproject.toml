[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-knowledge-agent"
version = "0.1.0"
description = "Universal harness for multi-disciplinary educational videos"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1", "httpx>=0.28,<1", "sqlalchemy>=2.0,<3",
  "pillow>=11,<13", "imageio-ffmpeg>=0.6,<1", "sympy>=1.13,<2",
  "filelock>=3.18,<4",
  "PyMuPDF>=1.25,<2",
]

[project.optional-dependencies]
manim = ["manim>=0.19,<0.21"]
production = ["temporalio>=1.9,<2", "psycopg[binary]>=3.2,<4", "boto3>=1.36,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
vibe = "harness.cli:main"

[tool.setuptools]
license-files = ["third_party/vibe-knowledge/LICENSE", "third_party/vibe-knowledge/NOTICE.md",
                 "renderers/remotion/project/public/fonts/OFL.txt"]

[tool.setuptools.packages.find]
include = ["harness*", "api*", "storage*", "workflows*", "renderers*", "domains*", "assets*"]

[tool.setuptools.package-data]
domains = ["**/*.json", "**/*.md"]
assets = ["*.json", "**/*.json", "**/*.md", "**/*.wav"]
renderers = [
  "remotion/project/package.json", "remotion/project/package-lock.json", "remotion/project/tsconfig.json",
  "remotion/project/remotion.config.ts", "remotion/project/README.md",
  "remotion/project/tools/*.ts",
  "remotion/project/src/*.ts", "remotion/project/src/*.tsx", "remotion/project/src/*.css",
  "remotion/project/src/**/*.ts", "remotion/project/src/**/*.tsx", "remotion/project/src/**/*.css",
  "remotion/project/public/**/*.json", "remotion/project/public/**/*.geojson", "remotion/project/public/**/*.md",
  "remotion/project/public/**/*.jpg", "remotion/project/public/**/*.png", "remotion/project/public/**/*.svg",
  "remotion/project/public/fonts/*.otf", "remotion/project/public/fonts/OFL.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["outputs", "data", "media", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
