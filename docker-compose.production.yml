name: knowmotion

services:
  app:
    image: ${KNOWMOTION_IMAGE:-knowmotion:production}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    shm_size: 1gb
    stop_grace_period: 60s
    env_file:
      - .env.production
    environment:
      PUBLIC_MODE: "true"
      API_TOKEN: ""
      EXECUTION_BACKEND: local
      LOCAL_WORKERS: "1"
      MAX_QUEUED_JOBS: "1"
      DATABASE_URL: sqlite:////app/data/jobs.db
      OUTPUT_DIR: /app/outputs
      PROJECT_ROOT: /app
      PYTHONPATH: /app
      MANIM_PYTHON: python
      MANIM_FONT: Noto Serif CJK SC
      CHINESE_FONT: Noto Serif CJK SC
      ENGLISH_FONT: Liberation Serif
      SUBTITLE_FONT: Noto Sans CJK SC
      FONT_PATH: /usr/share/fonts/opentype/noto/NotoSerifCJK-Regular.ttc
      ENGLISH_FONT_PATH: /usr/share/fonts/truetype/liberation2/LiberationSerif-Regular.ttf
      SUBTITLE_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      LATEX_COMPILER_PATH: /usr/bin/pdflatex
      LATEX_CACHE_DIR: /app/data/latex-cache
      REMOTION_PROJECT: ""
      REMOTION_ENTRY: src/index.ts
      REMOTION_BROWSER_EXECUTABLE: ""
      RENDER_CONCURRENCY: "4"
      REMOTION_CONCURRENCY: "1"
      BGM_PATH: /app/assets/audio/vibe-bgm.m4a
      BGM_VOLUME: "0.30"
      TTS_SPEED: "1"
      PLAYBACK_SPEED: "1.15"
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/www/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
